name: Terraform Infrastructure

on:
  pull_request:
    paths:
      - 'infra/environments/prod/**'
      - 'infra/modules/**'
      - 'k8s/argocd/applications/**'
  push:
    branches: [main]
    paths:
      - 'infra/environments/prod/**'
      - 'infra/modules/**'
      - 'k8s/argocd/applications/**'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: infra/environments/prod
  TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

jobs:
  plan:
    name: Validate & Plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive infra/
        continue-on-error: true

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false -no-color -out=tfplan.binary | tee plan_output.txt

      - name: Publish plan to job summary
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "## Terraform Plan (\`infra/environments/prod\`)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat plan_output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan.binary
          retention-days: 5

  apply:
    name: Apply (production)
    needs: plan
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve

      - name: Apply ArgoCD Application manifests
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          CLUSTER_NAME=$(terraform output -raw eks_cluster_name)
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"
          kubectl apply -f ../../../k8s/argocd/applications/

      - name: Record WAF ACL ARN in the frontend chart's prod values
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          WAF_ARN=$(terraform output -raw waf_acl_arn)
          VALUES_FILE="../../../k8s/charts/frontend/values-prod.yaml"
          if grep -q "^wafAclArn:" "$VALUES_FILE"; then
            sed -i -E "s|^wafAclArn:.*|wafAclArn: \"${WAF_ARN}\"|" "$VALUES_FILE"
          else
            echo "wafAclArn: \"${WAF_ARN}\"" >> "$VALUES_FILE"
          fi

          git config user.name "cloudmart-cd-bot"
          git config user.email "cd-bot@cloudmart.internal"
          git add "$VALUES_FILE"
          if git diff --cached --quiet; then
            echo "WAF ACL ARN unchanged, nothing to commit"
          else
            git commit -m "ci: record WAF ACL ARN in frontend prod values"
            git push origin HEAD:main
          fi
