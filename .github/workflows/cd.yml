name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to treat as the deploy target (main or develop)"
        required: true
        default: develop

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: us-east-1

jobs:
  update-gitops-manifests:
    name: Bump Helm image tags (triggers ArgoCD sync)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.resolve.outputs.branch }}
    steps:
      - id: resolve
        name: Resolve target branch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "branch=${{ github.event.inputs.branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.branch }}

      - name: Bump image tag for every service's environment values file
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ steps.resolve.outputs.branch }}
        run: |
          if [ -z "$SHA" ]; then
            echo "Manual dispatch, no new SHA to bump — skipping image tag update."
            exit 0
          fi

          if [ "$BRANCH" = "main" ]; then
            ENV_FILE_SUFFIX="prod"
          else
            ENV_FILE_SUFFIX="staging"
          fi

          for service in product-service order-service user-service notification-service frontend; do
            VALUES_FILE="k8s/charts/${service}/values-${ENV_FILE_SUFFIX}.yaml"
            if [ -f "$VALUES_FILE" ]; then
              sed -i -E "s/^( *tag: ).*/\1\"${SHA}\"/" "$VALUES_FILE"
            fi
          done

      - name: Commit & push (ArgoCD watches this branch and syncs automatically)
        env:
          BRANCH: ${{ steps.resolve.outputs.branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$SHA" ]; then
            exit 0
          fi
          git config user.name "cloudmart-cd-bot"
          git config user.email "cd-bot@cloudmart.internal"
          git add k8s/charts/*/values-prod.yaml k8s/charts/*/values-staging.yaml
          if git diff --cached --quiet; then
            echo "No image tag changes to commit"
            exit 0
          fi
          git commit -m "ci: bump image tags to ${SHA}"
          git push origin "HEAD:${BRANCH}"

  get-deployment-url:
    name: Fetch frontend URL
    needs: update-gitops-manifests
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name cloudmart-eks --region ${{ env.AWS_REGION }}

      - name: Wait for ArgoCD sync and fetch ALB hostname
        env:
          BRANCH: ${{ needs.update-gitops-manifests.outputs.branch }}
        run: |
          if [ "$BRANCH" = "main" ]; then
            NAMESPACE="cloudmart-prod"
          else
            NAMESPACE="cloudmart-staging"
          fi
          echo "NAMESPACE=$NAMESPACE" >> "$GITHUB_ENV"

          HOSTNAME=""
          for i in $(seq 1 20); do
            HOSTNAME=$(kubectl get ingress -n "$NAMESPACE" -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$HOSTNAME" ]; then
              break
            fi
            echo "Ingress not ready yet (attempt $i/20), waiting 15s for ArgoCD sync + ALB provisioning..."
            sleep 15
          done

          if [ -z "$HOSTNAME" ]; then
            echo "## Frontend URL ($NAMESPACE)" >> "$GITHUB_STEP_SUMMARY"
            echo "Ingress had no ALB hostname yet after waiting." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Frontend URL ($NAMESPACE)" >> "$GITHUB_STEP_SUMMARY"
            echo "http://${HOSTNAME}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Diagnostics (ArgoCD app status, pods, ingress, events)
        if: always()
        run: |
          echo "## ArgoCD Applications" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          kubectl get applications -n argocd -o wide >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "## Pods in $NAMESPACE" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          kubectl get pods -n "$NAMESPACE" -o wide >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "## Ingress in $NAMESPACE" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          kubectl get ingress -n "$NAMESPACE" -o wide >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          kubectl describe ingress -n "$NAMESPACE" >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "## ALB controller pods/logs" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          kubectl get pods -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          kubectl logs -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller --tail=50 >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
