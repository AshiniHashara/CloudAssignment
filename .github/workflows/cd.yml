name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, develop]

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: us-east-1

jobs:
  update-gitops-manifests:
    name: Bump Helm image tags (triggers ArgoCD sync)
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Bump image tag for every service's environment values file
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$BRANCH" = "main" ]; then
            ENV_FILE_SUFFIX="prod"
          else
            ENV_FILE_SUFFIX="staging"
          fi

          for service in product-service order-service user-service notification-service frontend; do
            VALUES_FILE="k8s/charts/${service}/values-${ENV_FILE_SUFFIX}.yaml"
            if [ -f "$VALUES_FILE" ]; then
              sed -i -E "s/^( *tag: ).*/\1\"${SHA}\"/" "$VALUES_FILE"
            fi
          done

      - name: Commit & push (ArgoCD watches this branch and syncs automatically)
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git config user.name "cloudmart-cd-bot"
          git config user.email "cd-bot@cloudmart.internal"
          git add k8s/charts/*/values-prod.yaml k8s/charts/*/values-staging.yaml
          if git diff --cached --quiet; then
            echo "No image tag changes to commit"
            exit 0
          fi
          git commit -m "ci: bump image tags to ${SHA}"
          git push origin "HEAD:${BRANCH}"

  get-deployment-url:
    name: Fetch frontend URL
    needs: update-gitops-manifests
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name cloudmart-eks --region ${{ env.AWS_REGION }}

      - name: Wait for ArgoCD sync and fetch ALB hostname
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$BRANCH" = "main" ]; then
            NAMESPACE="cloudmart-prod"
          else
            NAMESPACE="cloudmart-staging"
          fi

          HOSTNAME=""
          for i in $(seq 1 20); do
            HOSTNAME=$(kubectl get ingress -n "$NAMESPACE" -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$HOSTNAME" ]; then
              break
            fi
            echo "Ingress not ready yet (attempt $i/20), waiting 15s for ArgoCD sync + ALB provisioning..."
            sleep 15
          done

          if [ -z "$HOSTNAME" ]; then
            echo "## Frontend URL ($NAMESPACE)" >> "$GITHUB_STEP_SUMMARY"
            echo "Ingress had no ALB hostname yet after waiting. ArgoCD syncs on its own ~3min loop; re-run this job or check \`kubectl get ingress -n $NAMESPACE\` shortly." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Frontend URL ($NAMESPACE)" >> "$GITHUB_STEP_SUMMARY"
            echo "http://${HOSTNAME}" >> "$GITHUB_STEP_SUMMARY"
          fi
