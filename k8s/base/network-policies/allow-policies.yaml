---
# DNS — every pod needs this regardless of which AWS service it talks to
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: cloudmart-prod
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
---
# product-service → DynamoDB VPC endpoint only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-product-egress-dynamodb
  namespace: cloudmart-prod
spec:
  podSelector:
    matchLabels:
      app: product-service
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
---
