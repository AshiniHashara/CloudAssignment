# notification-service → SQS (poll) + SES (send) over the same VPC endpoint / AWS API path
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-notification-egress-sqs-ses
  namespace: cloudmart-prod
spec:
  podSelector:
    matchLabels:
      app: notification-service
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
---
# user-service → RDS PostgreSQL only — no other pod needs port 5432
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-user-egress-rds
  namespace: cloudmart-prod
spec:
  podSelector:
    matchLabels:
      app: user-service
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 5432
