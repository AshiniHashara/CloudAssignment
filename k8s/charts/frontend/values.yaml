image:
  repository: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/cloudmart/frontend
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: ClusterIP # ALB Ingress (target-type: ip) routes directly to pod IPs
  port: 80

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

hpa:
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

namespace: cloudmart-prod

# Populated automatically post-apply by the terraform.yml CD step (infra/modules/waf output)
wafAclArn: ""

serviceAccount:
  create: true
  annotations: {}
  name: frontend
